name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Build binaries
        run: |
          mkdir -p dist
          for p in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${p%/*}
            arch=${p#*/}
            echo ">> Building meta-ads-$os-$arch"
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -o "dist/meta-ads-$os-$arch" .
          done
          ls -la dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes "meta-ads $GITHUB_REF_NAME"